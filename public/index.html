<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiniDesk - Sistema de Chamados</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
</head>
<body>
<header>
  <div class="brand">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/></svg>
    </div>
    <div class="brand-text"><strong>MiniDesk</strong><span>Sistema de chamados - Parte Final</span></div>
  </div>
  <div class="header-badge">v2.0 PRO</div>
</header>
<main>
  <div class="left">
    <div class="card">
      <h2>📝 Novo Chamado</h2>
      <input id="titulo" placeholder="Título - Ex: Impressora não funciona">
      <textarea id="descricao" placeholder="Descreva em detalhes o que aconteceu..."></textarea>
      <div class="upload-box" id="dropZone">
        <label>📸 Anexar print / foto (opcional)</label>
        <input type="file" id="fileInput" accept="image/*" hidden>
        <button type="button" class="btn-upload" onclick="document.getElementById('fileInput').click()">Escolher imagem</button>
        <div id="preview"></div>
        <small>💡 Dica: arraste a imagem ou cole com CTRL+V</small>
      </div>
      <button class="btn-primary" onclick="criar()">Abrir Chamado 🚀</button>
    </div>
  </div>
  <div class="right"><div class="card"><h2>Chamados Abertos <span id="count">0</span></h2><div id="lista"></div></div></div>
</main>
<script src="script.js"></script>
</body>
</html>
